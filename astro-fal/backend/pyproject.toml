[project]
name = "astro-fal-backend"
version = "0.1.0"
description = "Kahve falı, burç, retro takvimi ve burç uyumu backend'i (FastAPI + Swiss Ephemeris)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pillow>=10.3",
    "python-multipart>=0.0.9",
    "pyswisseph>=2.10.3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"
